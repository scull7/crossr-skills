name: Deploy moved stub

# Replaces the frozen pre-cut marketing site at
# https://sycamore-hq.github.io/crossr-skills/
# with a pointer at the CrossR door. Does not resurrect site/.

on:
  push:
    branches: [main]
    paths:
      - "docs/moved/**"
      - ".github/workflows/deploy-moved.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-moved
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage stub as Pages root
        run: |
          mkdir -p _site
          cp docs/moved/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
